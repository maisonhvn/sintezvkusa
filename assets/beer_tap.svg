<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">

  <!-- Стакан (корпус) -->
  <path d="M18 18 L24 95 Q24 98 27 98 L73 98 Q76 98 76 95 L82 18 Z"
        fill="url(#beerGrad)" stroke="#e8c832" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Пиво (янтарный цвет) -->
  <path d="M21 34 L26 95 Q26 97 28 97 L72 97 Q74 97 74 95 L79 34 Z"
        fill="url(#amberGrad)" opacity="0.85"/>

  <!-- Пена (сверху) -->
  <ellipse cx="50" cy="34" rx="29" ry="7" fill="#f0f0f0" opacity="0.95"/>
  <ellipse cx="38" cy="31" rx="8" ry="5" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="55" cy="30" rx="10" ry="5.5" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="68" cy="32" rx="7" ry="4.5" fill="#f5f5f5" opacity="0.9"/>

  <!-- Ручка стакана -->
  <path d="M76 32 Q92 32 92 50 Q92 68 76 68"
        stroke="#e8c832" stroke-width="4" stroke-opacity="0.7"
        stroke-linecap="round" fill="none"/>
  <path d="M76 38 Q85 38 85 50 Q85 62 76 62"
        stroke="#e8c832" stroke-width="2" stroke-opacity="0.35"
        stroke-linecap="round" fill="none"/>

  <!-- Кран внутри стакана -->
  <!-- Основание крана -->
  <rect x="43" y="42" width="14" height="28" rx="4"
        fill="url(#tapBodyGrad)"/>
  <!-- Верх крана (голова) -->
  <rect x="40" y="36" width="20" height="9" rx="4.5"
        fill="#e8c832" opacity="0.95"/>
  <!-- Ручка крана (рычаг) -->
  <rect x="57" y="48" width="13" height="5" rx="2.5"
        fill="#e8c832" opacity="0.9"/>
  <circle cx="70" cy="50.5" r="4" fill="#e8c832"/>
  <circle cx="70" cy="50.5" r="2.2" fill="#c8a800"/>
  <!-- Носик крана -->
  <rect x="46" y="70" width="8" height="5" rx="2"
        fill="#b0b0b0" opacity="0.8"/>
  <!-- Блик на кране -->
  <rect x="45.5" y="44" width="3" height="22" rx="1.5"
        fill="white" opacity="0.15"/>

  <!-- Пузырьки в пиве -->
  <circle cx="38" cy="70" r="1.5" fill="#e8c832" opacity="0.4"/>
  <circle cx="65" cy="60" r="1" fill="#e8c832" opacity="0.35"/>
  <circle cx="42" cy="82" r="1.2" fill="#e8c832" opacity="0.3"/>
  <circle cx="68" cy="78" r="1" fill="#e8c832" opacity="0.35"/>

  <!-- Блики на стакане -->
  <path d="M25 22 L28 90" stroke="white" stroke-width="2.5"
        stroke-opacity="0.07" stroke-linecap="round"/>
  <path d="M30 22 L32 90" stroke="white" stroke-width="1"
        stroke-opacity="0.05" stroke-linecap="round"/>

  <defs>
    <linearGradient id="beerGrad" x1="18" y1="18" x2="82" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="21" y1="34" x2="79" y2="97" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a020"/>
      <stop offset="50%" stop-color="#c87810"/>
      <stop offset="100%" stop-color="#a05808"/>
    </linearGradient>
    <linearGradient id="tapBodyGrad" x1="43" y1="42" x2="57" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="40%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
  </defs>
</svg>
