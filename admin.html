<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Редактор кранов — Синтез Вкуса</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" />
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // Инициализация Firebase
    if (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('ВСТАВЬТЕ')) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
  </script>
  <script src="db.js"></script>
  <style>
    :root {
      --bg:      #161616;
      --card:    #1e1e1e;
      --card2:   #252525;
      --border:  rgba(255,255,255,0.08);
      --yellow:  #e8c832;
      --white:   #f0f0f0;
      --dim:     rgba(240,240,240,0.5);
      --red:     #e05252;
      --green:   #52c87a;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    a { text-decoration: none; color: inherit; }

    /* ── TOP BAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 64px;
      gap: 20px;
    }

    .topbar__title {
      font-family: 'Exo 2', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--yellow);
    }

    .topbar__sub {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.05em;
    }

    .topbar__actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      font-family: 'Exo 2', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border-radius: 8px;
      padding: 9px 22px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .btn--primary {
      background: var(--yellow);
      color: #111;
      border-color: var(--yellow);
    }
    .btn--primary:hover { background: #f0d240; }

    .btn--ghost {
      background: transparent;
      color: var(--dim);
      border-color: var(--border);
    }
    .btn--ghost:hover { color: var(--white); border-color: rgba(255,255,255,0.25); }

    .btn--danger {
      background: transparent;
      color: var(--red);
      border-color: rgba(224,82,82,0.3);
    }
    .btn--danger:hover { background: rgba(224,82,82,0.08); }

    /* ── LAYOUT ── */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 64px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      background: #111;
      border-right: 1px solid var(--border);
      padding: 20px 0;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .sidebar__label {
      font-family: 'Exo 2', sans-serif;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--dim);
      padding: 0 20px 10px;
    }

    .sidebar__item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 20px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      letter-spacing: 0.06em;
    }

    .sidebar__item:hover {
      background: rgba(255,255,255,0.04);
      color: var(--white);
    }

    .sidebar__item.active {
      border-left-color: var(--yellow);
      background: rgba(232,200,50,0.06);
      color: var(--yellow);
    }

    .sidebar__num {
      width: 26px;
      height: 26px;
      background: var(--card2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .sidebar__item.active .sidebar__num {
      background: var(--yellow);
      color: #111;
    }

    .sidebar__name {
      color: var(--dim);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar__item.active .sidebar__name { color: var(--yellow); }

    /* ── MAIN CONTENT ── */
    .main {
      padding: 36px 48px;
      max-width: 900px;
    }

    /* ── TAP EDITOR PANEL ── */
    .tap-editor {
      display: none;
    }
    .tap-editor.visible { display: block; }

    .tap-editor__header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .tap-editor__badge {
      width: 48px;
      height: 48px;
      background: var(--yellow);
      color: #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Exo 2', sans-serif;
      font-size: 20px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .tap-editor__heading {
      font-family: 'Exo 2', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tap-editor__link {
      margin-left: auto;
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.08em;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tap-editor__link:hover { color: var(--yellow); border-color: var(--yellow); }

    /* Form grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-full { grid-column: 1 / -1; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field__label {
      font-family: 'Exo 2', sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--yellow);
      font-weight: 500;
    }

    .field__input,
    .field__textarea {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .field__input:focus,
    .field__textarea:focus {
      border-color: rgba(232,200,50,0.5);
    }

    .field__textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.7;
    }

    .field__hint {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.03em;
    }

    /* Section divider */
    .section-title {
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 28px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Save row */
    .save-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .save-status {
      font-size: 13px;
      color: var(--green);
      opacity: 0;
      transition: opacity 0.3s;
      font-family: 'Exo 2', sans-serif;
      letter-spacing: 0.1em;
    }
    .save-status.show { opacity: 1; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--card);
      border: 1px solid rgba(82,200,122,0.4);
      border-radius: 10px;
      padding: 14px 24px;
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: var(--green);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(.22,1,.36,1);
      z-index: 999;
      pointer-events: none;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
      color: var(--dim);
      font-family: 'Exo 2', sans-serif;
      text-align: center;
    }
    .empty-state svg { opacity: 0.2; }
    .empty-state h2 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .empty-state p { font-size: 13px; letter-spacing: 0.05em; }

    /* ── PHOTO UPLOAD ── */
    .photo-section { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 4px; }

    .photo-drop {
      width: 160px; min-height: 200px; flex-shrink: 0;
      border: 2px dashed rgba(232,200,50,0.35); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer; transition: all 0.2s;
      background: rgba(255,255,255,0.02); position: relative; overflow: hidden;
    }
    .photo-drop:hover, .photo-drop.drag-over {
      border-color: var(--yellow); background: rgba(232,200,50,0.05);
    }
    .photo-drop input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .photo-drop__icon { opacity: 0.3; pointer-events: none; }
    .photo-drop__label {
      font-family: 'Exo 2', sans-serif; font-size: 10px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--dim); text-align: center;
      pointer-events: none; padding: 0 12px;
    }
    .photo-drop__preview {
      width: 100%; height: 100%; object-fit: cover;
      position: absolute; inset: 0; border-radius: 10px;
    }

    .photo-info { flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
    .photo-info__hint {
      font-size: 12px; color: var(--dim); line-height: 1.7; letter-spacing: 0.02em;
    }
    .photo-info__name {
      font-size: 12px; color: var(--yellow); font-family: 'Exo 2', sans-serif;
      letter-spacing: 0.08em; display: none;
    }  /* ── LOGIN SCREEN ── */
    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #1e1e1e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 48px 40px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }
    .login-box__logo {
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--yellow);
      text-align: center;
      margin-bottom: 4px;
    }
    .login-box__title {
      font-family: 'Exo 2', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--white);
    }
    .login-box__field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .login-box__label {
      font-family: 'Exo 2', sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--yellow);
    }
    .login-box__input {
      background: #252525;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .login-box__input:focus { border-color: rgba(232,200,50,0.5); }
    .login-box__error {
      color: var(--red);
      font-size: 12px;
      font-family: 'Exo 2', sans-serif;
      letter-spacing: 0.06em;
      text-align: center;
      min-height: 18px;
    }
    .login-box__btn {
      background: var(--yellow);
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-family: 'Exo 2', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .login-box__btn:hover { background: #f0d240; }

    /* ── STATUS CHECKBOXES ── */
    .status-checks {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 4px;
    }
    .status-check {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      transition: all 0.2s;
      user-select: none;
    }
    .status-check:hover { background: rgba(255,255,255,0.05); }
    .status-check input[type=checkbox] { display: none; }
    .status-check__box {
      width: 20px; height: 20px;
      border-radius: 5px;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      font-size: 13px;
    }
    .status-check__text {
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      transition: color 0.2s;
    }
    .status-check.checked-out-of-stock {
      border-color: rgba(224,82,82,0.5);
      background: rgba(224,82,82,0.07);
    }
    .status-check.checked-out-of-stock .status-check__box {
      border-color: var(--red);
      background: var(--red);
    }
    .status-check.checked-out-of-stock .status-check__text { color: var(--red); }
    .status-check.checked-discount {
      border-color: rgba(82,200,122,0.5);
      background: rgba(82,200,122,0.07);
    }
    .status-check.checked-discount .status-check__box {
      border-color: var(--green);
      background: var(--green);
    }
    .status-check.checked-discount .status-check__text { color: var(--green); }
  </style>
</head>
<body>

  <!-- ═══ LOGIN SCREEN ═══ -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-box__logo">⚙ Синтез Вкуса</div>
      <div class="login-box__title">Вход в панель управления</div>
      <div class="login-box__field">
        <label class="login-box__label" for="login-username">Логин</label>
        <input class="login-box__input" type="text" id="login-username" placeholder="Введите логин" autocomplete="username" />
      </div>
      <div class="login-box__field">
        <label class="login-box__label" for="login-password">Пароль</label>
        <input class="login-box__input" type="password" id="login-password" placeholder="Введите пароль" autocomplete="current-password" />
      </div>
      <div class="login-box__error" id="login-error"></div>
      <button class="login-box__btn" id="login-btn">Войти</button>
    </div>
  </div>

  <!-- ═══ TOP BAR ═══ -->
  <header class="topbar" id="topbar">
    <div>
      <div class="topbar__title">⚙ Редактор кранов</div>
      <div class="topbar__sub">Синтез Вкуса — управление содержимым</div>
    </div>
    <div class="topbar__actions">
      <button class="btn btn--danger" id="btn-reset-all">Сбросить всё</button>
      <button class="btn btn--ghost" onclick="window.open('index.html','_blank')">Открыть сайт ↗</button>
    </div>
  </header>

  <div class="layout">

    <!-- ═══ SIDEBAR ═══ -->
    <nav class="sidebar" id="sidebar" aria-label="Список кранов">
      <div class="sidebar__label">Краны</div>
      <!-- JS generates items -->
    </nav>

    <!-- ═══ MAIN ═══ -->
    <main class="main" id="main">

      <!-- Empty state (shown before selecting a tap) -->
      <div class="empty-state" id="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <h2>Выберите кран</h2>
        <p>Нажмите на номер крана слева,<br/>чтобы начать редактирование</p>
      </div>

      <!-- JS will inject editors here -->
      <div id="editors-container"></div>

    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">✓ Сохранено</div>

<script>
  const TAPS = 28;

  const FIELDS = [
    { key: 'name',  label: 'Название пива', type: 'input',    hint: 'Официальное название сорта' },
    { key: 'style', label: 'Стиль',          type: 'input',    hint: 'Например: American IPA, Stout…' },
    { key: 'desc',  label: 'Описание',        type: 'textarea', hint: 'Вкус, аромат, история, рекомендации к подаче' },
    { key: 'abv',   label: 'Крепость',        type: 'input',    hint: '5.2%' },
    { key: 'ibu',   label: 'Горечь (IBU)',    type: 'input',    hint: '35 IBU' },
    { key: 'og',    label: 'Плотность',       type: 'input',    hint: '12.5°P' },
    { key: 'color', label: 'Цвет',            type: 'input',    hint: 'Янтарный, Тёмный…' },
    { key: 'price', label: 'Цена',            type: 'input',    hint: '250 руб / литр' },
  ];

  // ── Кеш данных (загружается при старте) ──
  let _tapsCache  = {};
  let _photosCache = {};

  async function initCache() {
    _tapsCache   = await SV_DB.loadTaps();
    _photosCache = await SV_DB.loadPhotos();
    // Обновить sidebar после загрузки
    for (let n = 1; n <= TAPS; n++) {
      if (_tapsCache[n] && _tapsCache[n].name) updateSidebarName(n, _tapsCache[n].name);
    }
    showFirebaseStatus();
  }

  function showFirebaseStatus() {
    const sub = document.querySelector('.topbar__sub');
    if (!sub) return;
    if (SV_DB.isFirebaseReady()) {
      sub.innerHTML = 'Синтез Вкуса — <span style="color:#52c87a">●</span> Firebase подключён';
    } else {
      sub.innerHTML = 'Синтез Вкуса — <span style="color:#e05252">●</span> Только localStorage (настройте firebase-config.js)';
    }
  }

  function getTapData(n)   { return _tapsCache[n] || {}; }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg || '✓ Сохранено';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ── Sidebar ──
  function buildSidebar() {
    const sb = document.getElementById('sidebar');
    for (let n = 1; n <= TAPS; n++) {
      const item = document.createElement('div');
      item.className = 'sidebar__item';
      item.id = 'sb-item-' + n;
      item.setAttribute('role', 'button');
      item.innerHTML = '<span class="sidebar__num">' + n + '</span><span class="sidebar__name" id="sb-name-' + n + '">Кран ' + n + '</span>';
      item.addEventListener('click', (function(nn){ return function(){ selectTap(nn); }; })(n));
      sb.appendChild(item);
    }
  }

  function updateSidebarName(n, name) {
    const el = document.getElementById('sb-name-' + n);
    if (el) el.textContent = name || ('Кран ' + n);
  }

  // ── Build editors ──
  function buildEditors() {
    const container = document.getElementById('editors-container');
    for (let n = 1; n <= TAPS; n++) {
      const panel = document.createElement('div');
      panel.className = 'tap-editor';
      panel.id = 'editor-' + n;

      const basicFields = FIELDS.slice(0, 3);
      const specFields  = FIELDS.slice(3);

      function fieldHTML(f) {
        const full = f.type === 'textarea' ? ' form-full' : '';
        const inp  = f.type === 'textarea'
          ? '<textarea class="field__textarea" id="f-' + n + '-' + f.key + '" placeholder="' + f.hint + '" rows="4"></textarea>'
          : '<input class="field__input" id="f-' + n + '-' + f.key + '" type="text" placeholder="' + f.hint + '" />';
        return '<div class="field' + full + '"><label class="field__label" for="f-' + n + '-' + f.key + '">' + f.label + '</label>' + inp + '</div>';
      }

      panel.innerHTML =
        '<div class="tap-editor__header">' +
          '<div class="tap-editor__badge">' + n + '</div>' +
          '<h2 class="tap-editor__heading">Кран ' + n + '</h2>' +

  // ── Image compress via Canvas ──
  function compressImage(file, cb) {
    const MAX = 900;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.82), file.name);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── Photo upload init ──
  function initPhotoUpload(n) {
    const drop  = document.getElementById('photo-drop-' + n);
    const input = document.getElementById('photo-input-' + n);

    input.addEventListener('change', function() {
      if (this.files[0]) processPhoto(n, this.files[0]);
    });

    drop.addEventListener('dragover',  function(e){ e.preventDefault(); drop.classList.add('drag-over'); });
    drop.addEventListener('dragleave', function()  { drop.classList.remove('drag-over'); });
    drop.addEventListener('drop', function(e) {
      e.preventDefault(); drop.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) processPhoto(n, f);
    });
  }

  function processPhoto(n, file) {
    compressImage(file, async function(dataUrl, name) {
      try {
        await SV_DB.savePhoto(n, dataUrl);
        _photosCache[n] = dataUrl;
        showPhotoPreview(n, dataUrl, name);
        showToast('✓ Фото сохранено');
      } catch(e) {
        showToast('⚠ Ошибка сохранения фото');
      }
    });
  }

  function showPhotoPreview(n, dataUrl, name) {
    const drop = document.getElementById('photo-drop-' + n);
    let prev = drop.querySelector('.photo-drop__preview');
    if (!prev) { prev = document.createElement('img'); prev.className = 'photo-drop__preview'; drop.appendChild(prev); }
    prev.src = dataUrl;
    prev.style.display = 'block';
    drop.querySelector('.photo-drop__icon').style.display = 'none';
    drop.querySelector('.photo-drop__label').style.display = 'none';
    const nm = document.getElementById('photo-name-' + n);
    if (nm && name) { nm.textContent = name; nm.style.display = 'block'; }
  }

  async function clearPhoto(n) {
    await SV_DB.deletePhoto(n);
    delete _photosCache[n];
    const drop = document.getElementById('photo-drop-' + n);
    const prev = drop.querySelector('.photo-drop__preview');
    if (prev) prev.remove();
    drop.querySelector('.photo-drop__icon').style.display = '';
    drop.querySelector('.photo-drop__label').style.display = '';
    const nm = document.getElementById('photo-name-' + n);
    if (nm) { nm.textContent = ''; nm.style.display = 'none'; }
    document.getElementById('photo-input-' + n).value = '';
    showToast('Фото удалено');
  }

  // ── Populate editor ──
  function populateEditor(n) {
    const data = getTapData(n);
    FIELDS.forEach(function(f) {
      const el = document.getElementById('f-' + n + '-' + f.key);
      if (el) el.value = data[f.key] || '';
    });
    // Загрузить флаги статуса
    var outEl = document.getElementById('f-' + n + '-outOfStock');
    var discEl = document.getElementById('f-' + n + '-discount');
    if (outEl) {
      outEl.checked = !!data.outOfStock;
      outEl.dispatchEvent(new Event('change'));
    }
    if (discEl) {
      discEl.checked = !!data.discount;
      discEl.dispatchEvent(new Event('change'));
    }
    if (_photosCache[n]) showPhotoPreview(n, _photosCache[n], '');
    else {
      const drop = document.getElementById('photo-drop-' + n);
      if (!drop) return;
      const prev = drop.querySelector('.photo-drop__preview');
      if (prev) prev.remove();
      drop.querySelector('.photo-drop__icon').style.display = '';
      drop.querySelector('.photo-drop__label').style.display = '';
    }
  }

  let currentTap = null;
  function selectTap(n) {
    document.getElementById('empty-state').style.display = 'none';
    // Скрыть редактор фонов если открыт
    const bgEditor = document.getElementById('bg-editor');
    if (bgEditor) bgEditor.classList.remove('visible');

    if (currentTap) {
      document.getElementById('sb-item-' + currentTap).classList.remove('active');
      document.getElementById('editor-' + currentTap).classList.remove('visible');
    }
    currentTap = n;
    document.getElementById('sb-item-' + n).classList.add('active');
    populateEditor(n);
    document.getElementById('editor-' + n).classList.add('visible');
  }

  // ── Save tap ──
  async function doSaveTap(n) {
    const btn = document.getElementById('save-' + n);
    if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем…'; }
    const obj = {};
    FIELDS.forEach(function(f) {
      const el = document.getElementById('f-' + n + '-' + f.key);
      obj[f.key] = el ? el.value.trim() : '';
    });
    // Сохранить флаги статуса
    var outEl = document.getElementById('f-' + n + '-outOfStock');
    var discEl = document.getElementById('f-' + n + '-discount');
    obj.outOfStock = outEl ? outEl.checked : false;
    obj.discount   = discEl ? discEl.checked : false;
    try {
      await SV_DB.saveTap(n, obj);
      _tapsCache[n] = obj;
      updateSidebarName(n, obj.name);
      const st = document.getElementById('status-' + n);
      st.classList.add('show');
      setTimeout(function(){ st.classList.remove('show'); }, 2000);
      showToast('✓ Сохранено глобально');
    } catch(e) {
      showToast('⚠ Ошибка сохранения — проверьте Firebase');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить кран ' + n; }
    }
  }

  async function clearTap(n) {

    await SV_DB.deleteTap(n);

    populateEditor(n);

                 <source src="${existingVideoUrl}" />
               </video>
               <p style="font-family:'Exo 2',sans-serif;font-size:10px;letter-spacing:0.1em;color:rgba(240,240,240,0.4);margin:6px 0 8px;word-break:break-all;">${existingVideoUrl}</p>
               <div style="display:flex;gap:10px;">
                 <button class="btn btn--ghost" id="bg-change-vid">Изменить URL</button>
                 <button class="btn btn--danger" id="bg-remove-vid">Удалить</button>
               </div>`
            : `<div class="field" style="margin-bottom:12px">
                 <label class="field__label" for="bg-video-url">Прямая ссылка на видео (MP4 / WebM)</label>
                 <input class="field__input" type="url" id="bg-video-url" placeholder="https://..." />
               </div>
               <button class="btn btn--primary" id="bg-video-save-url">Сохранить видео</button>
               <div class="bg-size-warning" style="margin-top:12px">
                 💡 Вставьте прямую ссылку на видео-файл. Например, с Google Drive: в настройках файла нажмите «Открыть доступ» и скопируйте ссылку в формате:<br/><code style="color:#e8c832;font-size:11px">https://drive.google.com/uc?export=download&amp;id=ВАШ_ID</code>
               </div>`;
          wireVideoInput();
        }
      }

      // ── Обработчики ──

      function wireImageInput() {
        const fi = document.getElementById('bg-file-input');
        if (!fi) return;
        fi.addEventListener('change', async function() {
          const file = this.files[0];
          if (!file) return;
          compressImage(file, async function(dataUrl) {
            const all2 = loadBgAll();
            if (!all2[targetId]) all2[targetId] = {};
            all2[targetId].image = dataUrl;
            all2[targetId].type = 'image';
            cfg.image = dataUrl; cfg.type = 'image';
            await saveBgAll(all2);
            renderMediaArea('image');
            showToast('✓ Изображение загружено');
          });
        });
        const dz = document.getElementById('bg-drop-zone');
        if (dz) {
          dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
          dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
          dz.addEventListener('drop', e => {
            e.preventDefault(); dz.classList.remove('drag-over');
            const f = e.dataTransfer.files[0];
            if (f && (f.type === 'image/jpeg' || f.type === 'image/png' || f.type === 'image/webp')) {
              const dt = new DataTransfer(); dt.items.add(f); fi.files = dt.files; fi.dispatchEvent(new Event('change'));
            }
          });
        }
        const chBtn = document.getElementById('bg-change-img');
        if (chBtn) chBtn.addEventListener('click', () => fi.click());
        const rmBtn = document.getElementById('bg-remove-img');
        if (rmBtn) rmBtn.addEventListener('click', async () => {
          const all2 = loadBgAll();
          if (all2[targetId]) { delete all2[targetId].image; all2[targetId].type = 'default'; }
          cfg.image = null; cfg.type = 'default';
          await saveBgAll(all2);
          setActiveTypeBtn('default');
          renderMediaArea('default');
          showToast('Изображение удалено');
        });
      }

      function wireGifInput() {
        const fi = document.getElementById('bg-file-input');
        if (!fi) return;
        fi.addEventListener('change', function() {
          const file = this.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async function(e) {
            const dataUrl = e.target.result;
            const all2 = loadBgAll();
            if (!all2[targetId]) all2[targetId] = {};
            all2[targetId].image = dataUrl;
            all2[targetId].type = 'gif';
            cfg.image = dataUrl; cfg.type = 'gif';
            await saveBgAll(all2);
            renderMediaArea('gif');
            showToast('✓ GIF загружен');
          };
          reader.readAsDataURL(file);
        });
        const dz = document.getElementById('bg-drop-zone');
        if (dz) {
          dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
          dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
          dz.addEventListener('drop', e => {
            e.preventDefault(); dz.classList.remove('drag-over');
            const f = e.dataTransfer.files[0];
            if (f && f.type === 'image/gif') {
              const dt = new DataTransfer(); dt.items.add(f); fi.files = dt.files; fi.dispatchEvent(new Event('change'));
            }
          });
        }
        const chBtn = document.getElementById('bg-change-img');
        if (chBtn) chBtn.addEventListener('click', () => fi.click());
        const rmBtn = document.getElementById('bg-remove-img');
        if (rmBtn) rmBtn.addEventListener('click', async () => {
          const all2 = loadBgAll();
          if (all2[targetId]) { delete all2[targetId].image; all2[targetId].type = 'default'; }
          cfg.image = null; cfg.type = 'default';
          await saveBgAll(all2);
          setActiveTypeBtn('default');
          renderMediaArea('default');
          showToast('GIF удалён');
        });
      }

      function wireVideoInput() {
        // Режим URL: пользователь вводит прямую ссылку на MP4
        const saveBtn = document.getElementById('bg-video-save-url');
        if (saveBtn) {
          saveBtn.addEventListener('click', async function() {
            const urlInput = document.getElementById('bg-video-url');
            const url = urlInput ? urlInput.value.trim() : '';
            if (!url) { showToast('⚠ Введите ссылку на видео'); return; }
            const all2 = loadBgAll();
            if (!all2[targetId]) all2[targetId] = {};
            delete all2[targetId].image;
            all2[targetId].type = 'video';
            all2[targetId].videoUrl = url;
            cfg.type = 'video';
            cfg.videoUrl = url;
            await saveBgAll(all2);
            renderMediaArea('video');
            showToast('✓ Ссылка на видео сохранена!');
          });
        }
        // Кнопка «Изменить URL» (когда видео уже есть)
        const chBtn = document.getElementById('bg-change-vid');
        if (chBtn) chBtn.addEventListener('click', async () => {
          const newUrl = prompt('Введите новую ссылку на видео:', cfg.videoUrl || '');
          if (newUrl === null) return;
          const url = newUrl.trim();
          if (!url) return;
          const all2 = loadBgAll();
          if (!all2[targetId]) all2[targetId] = {};
          all2[targetId].type = 'video';
          all2[targetId].videoUrl = url;
          cfg.type = 'video';
          cfg.videoUrl = url;
          await saveBgAll(all2);
          renderMediaArea('video');
          showToast('✓ Ссылка обновлена!');
        });
        // Кнопка «Удалить»
        const rmBtn = document.getElementById('bg-remove-vid');
        if (rmBtn) rmBtn.addEventListener('click', async () => {
          const all2 = loadBgAll();
          if (all2[targetId]) { delete all2[targetId].videoUrl; all2[targetId].type = 'default'; }
          cfg.type = 'default'; cfg.videoUrl = null;
          await saveBgAll(all2);
          setActiveTypeBtn('default');
          renderMediaArea('default');
          showToast('Видео удалено');
        });
      }

      function setActiveTypeBtn(type) {
        document.querySelectorAll('.bg-type-btn').forEach(b => b.classList.toggle('active', b.dataset.bgtype === type));
      }

      // ── Переключение типа ──
      document.getElementById('bg-type-row').addEventListener('click', async function(e) {
        const btn = e.target.closest('.bg-type-btn');
        if (!btn) return;
        const newType = btn.dataset.bgtype;
        setActiveTypeBtn(newType);
        // Обновляем cfg.type в BgAll
        const all2 = loadBgAll();
        if (!all2[targetId]) all2[targetId] = {};
        all2[targetId].type = newType;
        cfg.type = newType;
        await saveBgAll(all2);
        renderMediaArea(newType);
      });

      // Начальный рендер медиа
      renderMediaArea(currentType === 'default' || !cfg.type ? 'default' : currentType);
    }

    // ── Переключение табов ──
    document.getElementById('bg-tabs').addEventListener('click', function(e) {
      const btn = e.target.closest('.bg-tab');
      if (!btn) return;
      document.querySelectorAll('.bg-tab').forEach(b => b.classList.remove('bg-tab--active'));
      btn.classList.add('bg-tab--active');
      currentTarget = btn.dataset.target;
      buildForm(currentTarget);
    });

    // ── Сохранение ──
    document.getElementById('bg-save').addEventListener('click', function() {
      const st2 = document.getElementById('bg-status');
      st2.classList.add('show');
      setTimeout(() => st2.classList.remove('show'), 2000);
      showToast('✓ Фон сохранён глобально');
    });

    // ── Сброс текущей страницы ──
    document.getElementById('bg-reset').addEventListener('click', async function() {
      const target = BG_TARGETS.find(t => t.id === currentTarget);
      if (!confirm(`Сбросить фон "${target.label}"?`)) return;
      const all2 = loadBgAll();
      delete all2[currentTarget];
      await saveBgAll(all2);
      buildForm(currentTarget);
      showToast(`Фон "${target.label}" сброшен`);
    });

    // Начальная форма
    initBgCache().then(() => buildForm(currentTarget));
  })();

</script>

</body>
</html>
