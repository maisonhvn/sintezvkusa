<script>
  (function() {
    var BG_KEY = 'sv_bg';
    var all = {}; try { all = JSON.parse(localStorage.getItem(BG_KEY)) || {}; } catch {}
    var cfg = all['index'] || {};
    var type = cfg.type || 'video';
    var overlay = cfg.overlay !== undefined ? cfg.overlay : 0.55;

    // Применяем оверлей
    var ov = document.querySelector('.hero__overlay');
    if (ov) ov.style.background = 'rgba(0,0,0,' + overlay + ')';

    if (type === 'image' && cfg.image) {
      var vid = document.querySelector('.hero__video');
      if (vid) vid.style.display = 'none';
      var hero = document.querySelector('.hero');
      if (hero) {
        var bgDiv = document.createElement('div');
        bgDiv.style.cssText = 'position:absolute;inset:0;z-index:0;background:url(' + cfg.image + ') center/cover no-repeat';
        hero.insertBefore(bgDiv, hero.firstChild);
      }
    } else if (type === 'color' && cfg.color) {
      var vid2 = document.querySelector('.hero__video');
      if (vid2) vid2.style.display = 'none';
      var hero2 = document.querySelector('.hero');
      if (hero2) {
        var bgDiv2 = document.createElement('div');
        bgDiv2.style.cssText = 'position:absolute;inset:0;z-index:0;background:' + cfg.color;
        hero2.insertBefore(bgDiv2, hero2.firstChild);
      }
    }
  })();
</script>
