    <div class="tap-page__overlay"></div>

<script>
  (async function() {
    var n = 21;
    try {
      var d = await SV_DB.loadTap(n);
      var set = function(id, val, fallback) {
        var el = document.getElementById(id);
        if (el && val) el.textContent = val;
        else if (el && fallback) el.textContent = fallback;
      };
      set('tap-' + n + '-name',  d.name,  'РќР°Р·РІР°РЅРёРµ РїРёРІР°');
      set('tap-' + n + '-style', d.style, 'РЎС‚РёР»СЊ РїРёРІР°');
      set('tap-' + n + '-desc',  d.desc,  'РћРїРёСЃР°РЅРёРµ РїРѕСЏРІРёС‚СЃСЏ РїРѕСЃР»Рµ Р·Р°РїРѕР»РЅРµРЅРёСЏ РІ СЂРµРґР°РєС‚РѕСЂРµ.');
      set('tap-' + n + '-abv',   d.abv,   'вЂ” %');
      set('tap-' + n + '-ibu',   d.ibu,   'вЂ” IBU');
      set('tap-' + n + '-og',    d.og,    'вЂ” В°P');
      set('tap-' + n + '-color', d.color, 'вЂ”');
      set('tap-' + n + '-price', d.price, 'вЂ” СЂСѓР± / Р»РёС‚СЂ');
      var photoUrl = await SV_DB.loadPhoto(n);
      if (photoUrl) {
        var panel = document.getElementById('tap-' + n + '-photo');
        if (panel) {
          var img = document.createElement('img');
          img.src = photoUrl;
          img.alt = 'Р¤РѕС‚Рѕ РїРёРІР° РЅР° РєСЂР°РЅРµ ' + n;
          img.className = 'tap-page__photo';
          panel.parentNode.replaceChild(img, panel);
        }
      }
    } catch(e) { console.warn('tap data load error', e); }
  })();
</script><script>
  (async function() {
    var all = await SV_DB.loadBgAll();
    var cfg = all['taps'] || {};
    var overlay = cfg.overlay !== undefined ? cfg.overlay : 0.82;
    var ov = document.querySelector('.tap-page__overlay');
    if (ov) ov.style.background = 'rgba(10,10,10,' + overlay + ')';
    var tapVid = document.querySelector('.tap-page__video');
    var tapPg  = document.querySelector('.tap-page');
    var bgType = cfg.type || 'default';
    if (bgType === 'image' && cfg.image) {
      if (tapVid) tapVid.style.display = 'none';
      if (tapPg) { var d = document.createElement('div'); d.style.cssText='position:fixed;inset:0;z-index:0;background:url('+cfg.image+') center/cover no-repeat'; tapPg.insertBefore(d, tapPg.firstChild); }
    } else if (bgType === 'gif' && cfg.image) {
      if (tapVid) tapVid.style.display = 'none';
      if (tapPg) { var dg = document.createElement('img'); dg.src=cfg.image; dg.style.cssText='position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;pointer-events:none;'; tapPg.insertBefore(dg, tapPg.firstChild); }
    } else if (bgType === 'video' && cfg.videoUrl) {
      if (tapVid) tapVid.style.display = 'none';
      if (tapPg) { var dv = document.createElement('video'); dv.autoplay=true; dv.muted=true; dv.loop=true; dv.playsInline=true; dv.style.cssText='position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;pointer-events:none;'; dv.src=cfg.videoUrl; tapPg.insertBefore(dv, tapPg.firstChild); dv.play().catch(function(){}); }
    } else if (bgType === 'color' && cfg.color) {
      if (tapVid) tapVid.style.display = 'none';
      if (tapPg) { var dc = document.createElement('div'); dc.style.cssText='position:fixed;inset:0;z-index:0;background:'+cfg.color; tapPg.insertBefore(dc, tapPg.firstChild); }
    }
  })();
</script>
